# Daily tournament-calendar collection.
#
# Runs the calendars that only render in a real browser — ITF Juniors today —
# and posts them to the API. Deliberately NOT on the application server: a
# Chromium session is the hungriest thing that could be put on a 4 GB box that
# also hosts another live application, and a scraper that spikes memory at 04:00
# and gets a neighbour killed is a bad trade for a calendar.
#
# UTR is not here. Its event search answers plain HTTPS with no browser and no
# credentials, so the API pulls it directly on the same daily schedule.
#
# Nothing collected is ever committed to this repository. Rows travel straight
# to the API over the machine-token endpoint and land in the database.
#
# Required repository secrets:
#   TENNISAI_API_URL     https://<host>/api
#   TENNISAI_FEED_TOKEN  the server's FEED_PUSH_TOKEN

name: Tournament calendar

on:
  schedule:
    # 04:10 UTC daily — after the server's own 04:00 UTR pull, and well clear of
    # the 03:17 database backup. GitHub's scheduler drifts under load; nothing
    # here depends on the exact minute.
    - cron: "10 4 * * *"
  workflow_dispatch:
    inputs:
      months:
        description: "Months ahead to collect"
        required: false
        default: "6"
      dry_run:
        description: "Collect and print, post nothing"
        type: boolean
        required: false
        default: false

# One at a time. A run that overlaps yesterday's would double the load on the
# source for no benefit.
concurrency:
  group: tournament-calendar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Generous, because geocoding is deliberately rate-limited to one request a
    # second under Nominatim's usage policy.
    timeout-minutes: 45
    permissions:
      contents: read

    strategy:
      # One source failing must not cancel the others.
      fail-fast: false
      matrix:
        source:
          - itf-juniors

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scrapers/package.json

      - name: Install
        working-directory: scrapers
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: scrapers
        run: npx playwright install --with-deps chromium

      - name: Collect and post
        working-directory: scrapers
        env:
          TENNISAI_API_URL: ${{ secrets.TENNISAI_API_URL }}
          TENNISAI_FEED_TOKEN: ${{ secrets.TENNISAI_FEED_TOKEN }}
        run: |
          npm run scrape -- \
            --source ${{ matrix.source }} \
            --months ${{ github.event.inputs.months || '6' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
