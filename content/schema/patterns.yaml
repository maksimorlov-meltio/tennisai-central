# TennisAI coaching library — controlled tactical-pattern vocabulary.
#
# A `pattern` is a recurring sequence of shots and positions, not a stroke.
# Every `taxonomy.patterns` entry in a drill document must appear here; the
# validator rejects anything else. A drill may carry zero patterns (a warm-up
# or a technique drill usually does) — patterns are only claimed when the drill
# genuinely rehearses the sequence.

