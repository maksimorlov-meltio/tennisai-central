# TennisAI coaching library — controlled skill vocabulary.
#
# Every `taxonomy.skills` entry in a drill document must appear here; the
# validator rejects anything else. Tags are grouped by the domain they most
# naturally belong to, but a drill in ANY domain may use ANY tag — a footwork
# drill legitimately trains `split_step` and `recovery_step` at once, and a
# games_kids drill trains `racket_control` while it trains `cooperative_rallying`.
#
# Adding a tag is a deliberate act: prefer reusing an existing one. A vocabulary
# that grows a synonym per drill stops being a vocabulary.

technique:
  - forehand_drive
  - forehand_topspin
  - forehand_slice
