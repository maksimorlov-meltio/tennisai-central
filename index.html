<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tennis AI — run the tennis season with your coach</title>
    <meta name="description" content="One workspace for coaches, players and parents: a shared colour-coded season calendar, structured session planning, tournament entries and a player kit log." />
    <meta name="author" content="Tennis AI" />

    <meta property="og:title" content="Tennis AI — run the tennis season with your coach" />
    <meta property="og:description" content="One workspace for coaches, players and parents: a shared colour-coded season calendar, structured session planning, tournament entries and a player kit log." />
    <meta property="og:site_name" content="Tennis AI" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://46-225-83-85.sslip.io/" />
    <!-- Plain brand card generated from the existing brand assets (icon-512.png
         on --primary, matte forest green) — no photos, no invented claims. -->
    <meta property="og:image" content="https://46-225-83-85.sslip.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tennis AI — run the tennis season with your coach" />
    <meta name="twitter:description" content="One workspace for coaches, players and parents: a shared colour-coded season calendar, structured session planning, tournament entries and a player kit log." />
    <meta name="twitter:image" content="https://46-225-83-85.sslip.io/og-image.png" />

    <!-- Installable. With the manifest below, the browser offers "Add to
         Home Screen" and the app opens without browser chrome. public/sw.js
         now also registers at app start (see src/lib/sw/register.ts) to
         cache-first the app shell (HTML shell + hashed /assets/*) — network
         requests to /api/* are never intercepted. Web push is unaffected. -->
    <!-- Explicit, because the implicit /favicon.ico fallback is still the
         Lovable scaffolding logo this project was generated from — a gradient
         heart, i.e. another product's brand in every TennisAI browser tab.
         The PNG below is placeholder brand art and wants replacing with a
         designed mark, but anything on-brand beats a competitor's logo. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Matches theme_color in the manifest: --primary, matte forest green. -->
    <meta name="theme-color" content="#406851" />

    <!-- iOS ignores the manifest for standalone mode and reads these instead. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TennisAI" />
    <!-- black-translucent puts the page under the status bar, which is the
         point of viewport-fit=cover above and the safe-area insets in the CSS. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>

  <body>
    <script>try{const t=localStorage.getItem("theme");if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
