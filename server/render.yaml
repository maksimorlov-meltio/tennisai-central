# Render Blueprint — API service + managed Postgres (FREE tier, for a private test).
# Deploy: push to GitHub, then New > Blueprint in the Render dashboard and point
# it at this repo. Set APP_URL to the deployed frontend origin after the first deploy.
#
# NOTE: the free tier has no pre-deploy hook, so migrations + seed run at startup
# (both idempotent). Free web services sleep after ~15 min idle (first request cold-
# starts in ~30s) and the free database expires after ~30 days — fine for a trial.
services:
  - type: web
    name: tennisai-api
    runtime: node
    rootDir: server
    plan: free
    # Build phase has devDeps (prisma, tsx, typescript) available.
    buildCommand: npm ci && npm run build
    # Free tier lacks preDeployCommand, so apply migrations + seed at boot (idempotent),
    # then start the API. Seeding loads the demo coach/players + the tournament catalog
    # with coordinates so there's something to explore on first login.
    startCommand: npm run migrate:deploy && (npm run prisma:seed || echo "seed skipped") && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tennisai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # strong random secret (satisfies the production secret check)
      - key: JWT_EXPIRES_IN
        value: 1d
      # Test trial: no email service — users sign up and log in without a verify link.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      # Private-trial access gate: signup requires this code. Choose any value in the
      # Render dashboard and share it with your brother/coach. Without it set, anyone
      # with the URL could register.
      - key: SIGNUP_INVITE_CODE
        sync: false
      - key: APP_URL
        sync: false # set to the deployed frontend origin, e.g. https://tennisai.vercel.app

databases:
  - name: tennisai-db
    plan: free
    databaseName: tennisai
    user: tennisai
